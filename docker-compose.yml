services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graphscope
      POSTGRES_PASSWORD: graphscope
      POSTGRES_DB: graphscope
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphscope -d graphscope"]
      interval: 5s
      timeout: 5s
      retries: 5
