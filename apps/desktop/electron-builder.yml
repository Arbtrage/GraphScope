appId: com.graphscope.desktop
productName: GraphScope
copyright: Copyright © 2026 GraphScope contributors

directories:
  output: dist/release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - "!**/*.map"
  - "!**/.turbo/**"
  - "!resources/**"
  - "!scripts/**"
  - "!src/**"

asar: true
npmRebuild: false
nodeGypRebuild: false
electronVersion: 33.4.11
# Native PG binaries + keytar must live on a real filesystem (chmod/exec).
asarUnpack:
  - "**/*.node"
  - "**/embedded-postgres/**"
  - "**/@embedded-postgres/**"
  - "**/keytar/**"
  - "**/node_modules/@embedded-postgres/**/*"
  - "**/node_modules/embedded-postgres/**/*"
  - "**/node_modules/keytar/**/*"

extraResources:
  - from: resources/web
    to: web
  - from: resources/api
    to: api
  - from: resources/database
    to: database

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  icon: build/icon.png
  target:
    - dmg
    - zip

dmg:
  title: GraphScope

publish: null
