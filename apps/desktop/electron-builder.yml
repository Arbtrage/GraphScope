appId: com.graphscope.desktop
productName: GraphScope
copyright: Copyright © 2026 GraphScope contributors

directories:
  output: dist/release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - "!**/*.map"
  - "!**/.turbo/**"
  - "!resources/**"
  - "!scripts/**"
  - "!src/**"

asar: true
npmRebuild: false
nodeGypRebuild: false
electronVersion: 33.4.11
# Only unpack native binaries. Unpacking the embedded-postgres JS package
# breaks Node resolution of its dependency `pg` (still inside the asar).
asarUnpack:
  - "**/*.node"
  - "**/node_modules/@embedded-postgres/**/native/**"
  - "**/node_modules/keytar/**"

extraResources:
  - from: resources/web
    to: web
  - from: resources/api
    to: api
  - from: resources/database
    to: database

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  icon: build/icon.png
  target:
    - dmg
    - zip

dmg:
  title: GraphScope

publish: null
