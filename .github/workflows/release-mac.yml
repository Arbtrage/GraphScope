name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @graphscope/config build
          pnpm --filter @graphscope/shared-types build
          pnpm --filter @graphscope/db build
          pnpm --filter @graphscope/api build
          pnpm --filter @graphscope/ui build
          pnpm --filter @graphscope/web build
          pnpm --filter @graphscope/desktop build

      - name: Package macOS app
        run: echo "TODO — wire electron-builder publish step"
        # pnpm --filter @graphscope/desktop exec electron-builder --mac --config electron-builder.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphscope-macos
          path: apps/desktop/dist/release/**
          if-no-files-found: ignore
