name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @graphscope/config build
          pnpm --filter @graphscope/shared-types build
          pnpm --filter @graphscope/schema-tools build
          pnpm --filter @graphscope/db build
          pnpm --filter @graphscope/api build
          pnpm --filter @graphscope/ui build
          pnpm --filter @graphscope/web build
          pnpm --filter @graphscope/desktop build

      - name: Package macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @graphscope/desktop package:mac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphscope-macos
          path: |
            apps/desktop/dist/release/*.dmg
            apps/desktop/dist/release/*.zip
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop/dist/release/*.dmg
            apps/desktop/dist/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
